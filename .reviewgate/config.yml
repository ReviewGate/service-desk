# Правила проекта для автоматического ревью. Это машинная версия docs/conventions.md —
# когда меняется одно, второе правится тем же коммитом.
version: 1
language: ru
preset: angular

# Гейт выключен: я тут один и сам решаю, что блокирует пуш, а что нет.
# Порог для конкретного прогона задаю флагом --fail-on, когда это нужно (хук перед push).
severity_gate: off

# Тестов в проекте нет и не планируется — не отмечать их отсутствие как проблему.
tests: optional

llm:
  generators:
    - model: deepseek-v4-flash # ищет: быстрый и дешёвый
  judges:
    - model: deepseek-v4-pro   # судит по полным файлам: сильнее и вдумчивее

  full_file_context: true      # генератору — файлы находок целиком, не только дифф
  environment_context: true    # версии стека в промпт: Angular 21, zoneless, новый control flow

# Свёрнутый блок с таймингами и решениями судьи. Кода в нём нет, только метаданные.
diagnostics: true

# Однозначные механические правки — нативным suggestion-блоком.
committable_suggestions: true

cost:
  show: true
  currency: "$"
  models:
    deepseek-v4-flash: { input: 0.44, output: 1.32 }  # пиковый прайс — не дороже
    deepseek-v4-pro:   { input: 1.32, output: 3.96 }

# Правила = только то, чего не видит ESLint. id уезжает в ruleId находки.
rules:
  - id: http-only-in-api-service
    description: "Обращения к сети живут только в core/api.service.ts. Компоненты, пайпы и резолверы не инжектят HttpClient и не знают про адреса эндпоинтов."
    severity: critical

  - id: no-leaking-subscriptions
    description: "Каждая подписка в компоненте умирает вместе с ним. По убыванию предпочтения: async-пайп в шаблоне, toSignal, takeUntilDestroyed(). Голый subscribe() без управления жизненным циклом — утечка, даже если поток выглядит конечным."
    severity: critical

  - id: authorization-is-server-side
    description: "Скрытая по роли кнопка или пункт меню — удобство интерфейса, а не защита. Если действие доступно не всем, проверка обязана быть на сервере; наличие только фронтового @if (isAdmin()) вокруг вызова API — дефект безопасности."
    severity: critical

  - id: debounce-user-input
    description: "Поле ввода или фильтр, от которого уходит запрос к API, снабжается задержкой не меньше 300 мс и distinctUntilChanged. Без этого запрос уходит на каждое нажатие клавиши."
    severity: major

  - id: three-states-on-load
    description: "Загрузка данных обрабатывает три состояния: идёт загрузка, ошибка, пустой результат. Отсутствие ветки ошибки — дефект, а не недоделка: пользователь видит вечный «Загружаем…»."
    severity: major

  - id: signals-in-new-code
    description: "Новое состояние — на сигналах (signal/computed). Заводить новые BehaviorSubject/Subject для состояния экрана нельзя; core/api.service.ts — унаследованное исключение, его переписывать по ходу дела не просить."
    severity: major

  - id: format-through-pipes
    description: "Даты и телефоны форматируются пайпами (DatePipe, sdPhone), а не сборкой строк в компоненте."
    severity: minor

  - id: routes-from-constants
    description: "Пути роутинга берутся константами из app.routes.ts, а не пишутся строками в шаблонах и компонентах."
    severity: minor

# Осознанные допущения — не флагать, класс ложных срабатываний гасится целиком.
dont_flag:
  - "Локализация: панель внутренняя, тексты по-русски прямо в шаблонах — это решение, а не недоработка"
  - "Отсутствие unit-тестов — в проекте их нет намеренно"
  - "Инлайновые шаблоны и стили в мелких презентационных компонентах (status-badge) — так и задумано"
  - "BehaviorSubject в core/api.service.ts — унаследованный код, переезд на сигналы идёт
     постепенно. Допущение про ЭТОТ файл: в новом коде BehaviorSubject остаётся нарушением"

ignore:
  - "**/*.spec.ts"
  - "src/assets/**"
  - "**/*.svg"
  - "**/*.png"

review_prompt:
  mode: extend
  text: |
    Панель внутренняя, ей пользуются менеджеры весь рабочий день, не закрывая вкладку.
    Поэтому дополнительно смотри:
    - Долгоживущие подписки, таймеры и интервалы: вкладка живёт сутками.
    - Поведение экрана, когда API ответил ошибкой или пустым списком.
    - Действия, меняющие данные: что увидит менеджер, если запрос не прошёл.
    Чисто стилевое и то, что ловит линтер, не трогай.
